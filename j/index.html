<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Smash</title>

<!-- 크롤러(카톡·X·디스코드)는 JS를 안 돌린다. 채팅방 미리보기는 전적으로 이 태그들로 만들어진다.
     **코드는 여기 못 싣는다** — 정적 파일 한 장이라 방마다 다른 카드를 구울 수가 없다.
     그래서 공유 메시지의 「방 코드: XXXXXX」 줄이 사람에게는 유일한 코드다. -->
<meta property="og:title" content="Number Smash">
<meta property="og:description" content="방에 초대받았어요. 눌러서 들어가기">
<meta property="og:image" content="https://numbersmash.github.io/og.png">
<meta property="og:url" content="https://numbersmash.github.io/j/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
       background:#221f20;color:#f2ede6;text-align:center;padding:24px}
  .wrap{max-width:22rem;width:100%}
  .label{opacity:.65;font-size:.9rem;letter-spacing:.02em;margin:0 0 .4rem}
  .code{font-size:2.6rem;font-weight:700;letter-spacing:.22em;margin:0 0 .2rem;
        /* 글자 사이를 벌리면 마지막 글자 뒤에도 틈이 생겨 가운데가 왼쪽으로 밀린다 */
        text-indent:.22em}
  .dev{display:inline-block;font-size:.7rem;letter-spacing:.1em;opacity:.55;
       border:1px solid currentColor;border-radius:3px;padding:0 .35em;vertical-align:.35em}
  .btn{display:block;margin:.6rem 0;padding:.85rem 1rem;border-radius:.6rem;
       text-decoration:none;font-weight:600;border:0;width:100%;font-size:1rem;cursor:pointer;
       font-family:inherit}
  .primary{background:#f2ede6;color:#221f20}
  .secondary{background:transparent;color:#f2ede6;border:1px solid rgba(242,237,230,.35)}
  .note{opacity:.6;font-size:.85rem;margin:.9rem 0 0;min-height:1.6em}
</style>
</head>
<body>

<div class="wrap" id="wrap" hidden>
  <p class="label" id="label">방 코드</p>
  <p class="code"><span id="code"></span> <span class="dev" id="dev" hidden>DEV</span></p>
  <button class="btn primary" id="open">앱에서 열기</button>
  <button class="btn secondary" id="get">앱 받기</button>
  <p class="note" id="note"></p>
</div>

<script>
(function () {
  // ── 스토어 ────────────────────────────────────────────────────
  var ANDROID_ID = 'com.playburiburi.numbersmash';
  var ANDROID = 'https://play.google.com/store/apps/details?id=' + ANDROID_ID;
  var IOS     = 'https://apps.apple.com/app/6799653686';
  var OTHER   = 'https://linktr.ee/playburiburi';
  var SCHEME  = 'numbersmash';
  // ─────────────────────────────────────────────────────────────

  // 앱의 번역표와 같은 아홉 언어. 없는 언어는 영어로 떨어진다(앱과 같은 규칙).
  var T = {
    en:{label:'Room code',open:'Open in app',get:'Get the app',copied:'Code copied. Enter it in the app after installing.'},
    ko:{label:'방 코드',open:'앱에서 열기',get:'앱 받기',copied:'코드를 복사했어요. 설치한 뒤 앱에 입력하세요'},
    ja:{label:'ルームコード',open:'アプリで開く',get:'アプリを入手',copied:'コードをコピーしました。インストール後にアプリで入力してください'},
    de:{label:'Raumcode',open:'In der App öffnen',get:'App holen',copied:'Code kopiert. Nach der Installation in der App eingeben.'},
    fr:{label:'Code du salon',open:"Ouvrir dans l'app",get:"Obtenir l'app",copied:"Code copié. Saisis-le dans l'app après l'installation."},
    es:{label:'Código de sala',open:'Abrir en la app',get:'Obtener la app',copied:'Código copiado. Introdúcelo en la app tras instalarla.'},
    pt:{label:'Código da sala',open:'Abrir no app',get:'Baixar o app',copied:'Código copiado. Digite no app após instalar.'},
    it:{label:'Codice stanza',open:"Apri nell'app",get:"Scarica l'app",copied:"Codice copiato. Inseriscilo nell'app dopo l'installazione."},
    zh:{label:'房間代碼',open:'用 App 開啟',get:'下載 App',copied:'已複製代碼。安裝後在 App 中輸入'}
  };
  var lang = (navigator.language || 'en').toLowerCase();
  var t = T[lang.slice(0,2)] || T.en;

  var ua = navigator.userAgent;
  // iPadOS 13+ Safari는 UA를 Mac으로 보고한다. 터치 포인트로 갈라낸다.
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua) && !/Windows Phone/.test(ua);
  var inKakao = /KAKAOTALK/i.test(ua);

  var q = new URLSearchParams(location.search);
  var code = (q.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  var dev  = q.get('e') === 'd';
  // 한 번 밖으로 내보냈거나 앱 열기에 실패해 되돌아온 표시. **이게 없으면 무한히 되돌아온다.**
  var bounced = q.get('x') === '1';

  // 코드가 없으면 그냥 홍보 페이지다 — 루트와 같은 길로 보낸다.
  if (!code) { location.replace(isIOS ? IOS : isAndroid ? ANDROID : OTHER); return; }

  var payload = 'c=' + code + (dev ? '&e=d' : '');
  var self    = location.origin + location.pathname + '?' + payload;
  var appUrl  = SCHEME + '://j/?' + payload;
  var store   = isIOS ? IOS
              : isAndroid ? ANDROID + '&referrer=' + encodeURIComponent(payload)
              : OTHER;

  // 안드로이드는 intent:// 가 정석이다 — 앱이 있으면 열고, 없으면 fallback으로 되돌아온다.
  // 카톡 인앱 브라우저에서도 이건 동작한다(커스텀 스킴은 막혀 있다).
  var intentUrl = 'intent://j/?' + payload + '#Intent;scheme=' + SCHEME +
                  ';package=' + ANDROID_ID +
                  ';S.browser_fallback_url=' + encodeURIComponent(self + '&x=1') + ';end';
  var launch = isAndroid ? intentUrl : appUrl;

  // ── 화면 ──────────────────────────────────────────────────────
  document.getElementById('label').textContent = t.label;
  document.getElementById('code').textContent  = code;
  document.getElementById('open').textContent  = t.open;
  document.getElementById('get').textContent   = t.get;
  document.getElementById('dev').hidden        = !dev;
  document.getElementById('wrap').hidden       = false;
  document.documentElement.lang = lang.slice(0,2);

  document.getElementById('open').onclick = function () { location.href = launch; };
  document.getElementById('get').onclick  = function () {
    copy(code);
    document.getElementById('note').textContent = t.copied;
    // 글자를 읽을 틈을 아주 조금 준다. 바로 넘기면 복사됐다는 걸 아무도 못 본다.
    setTimeout(function () { location.href = store; }, 450);
  };

  // ── 자동으로 해 보는 것 ───────────────────────────────────────
  if (isAndroid && !bounced) {
    location.replace(intentUrl);
  } else if (isIOS && inKakao && !bounced) {
    // **카톡 iOS 인앱 브라우저는 커스텀 스킴을 막고 유니버설 링크도 안 놔준다.**
    // 이 비공식 스킴으로 주소를 OS에 넘기면 iOS가 유니버설 링크를 보고 앱을 직접 연다.
    // 앱이 없으면 사파리가 이 페이지를 열고, x=1이 붙어 있어 두 번 튀지 않는다.
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(self + '&x=1');
  }
  // 그 밖(사파리·크롬·PC)에서는 아무것도 자동으로 안 한다 — 앱이 없을 때 스킴을 쏘면
  // 「주소가 올바르지 않습니다」 경고가 뜬다. 누른 사람에게만 그 위험을 지운다.

  function copy(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return; }
    } catch (e) { /* 아래로 떨어진다 */ }
    // 구형 인앱 브라우저용. execCommand는 사라지는 중이지만 여기 말고는 길이 없다.
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly',''); ta.style.position='absolute'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
